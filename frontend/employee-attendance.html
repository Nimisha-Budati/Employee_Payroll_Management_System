<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Attendance · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1>Attendance &amp; shift</h1><p>Check in and out from the office. Your location is only used to confirm you are on site.</p></div>
    <div class="page-actions" id="actions"><a class="btn" href="ai-assistant.html?tab=ATTENDANCE" id="insightLink"></a></div>
  </div>
  <div class="grid grid-main">
    <section class="card"><div class="card-header"><div><h2>Today</h2><p id="todayDate"></p></div><div id="todayBadge"></div></div><div class="card-body" id="today"></div></section>
    <section class="card"><div class="card-header"><div><h2>My shift</h2><p id="shiftNote"></p></div></div><div class="card-body" id="shiftInfo"></div></section>
  </div>
  <section class="grid grid-4" id="monthStats" style="margin-top:20px" aria-label="This month"></section>
  <section class="card" style="margin-top:20px">
    <div class="card-header"><div><h2>Recent attendance</h2><p>Your last 30 records</p></div></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Shift</th><th>Check in</th><th class="right">Late</th><th>Check out</th><th class="right">Hours worked</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <section class="card" style="margin-top:20px">
    <div class="card-header"><div><h2>Shift history</h2><p>Shifts assigned to you by an administrator</p></div></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Shift</th><th>Hours</th><th>From</th><th>To</th><th>Notes</th></tr></thead><tbody id="shiftRows"></tbody></table></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/my-attendance.js"></script>
</body>
</html>
