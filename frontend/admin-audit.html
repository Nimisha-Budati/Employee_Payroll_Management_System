<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Audit log · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1>Audit log</h1><p>Who did what, in which module, when and from which IP address.</p></div>
    <div class="page-actions"></div>
  </div>
  <section class="card">
    <div class="toolbar">
      <div class="input-group grow"><span id="searchIcon"></span><input class="input" id="search" type="search" placeholder="Search summary or person" aria-label="Search audit log"></div>
      <select class="select" id="entity" aria-label="Filter by module"><option value="">All modules</option><option value="Authentication">Authentication</option><option value="Employees">Employees</option><option value="Attendance">Attendance</option><option value="Shifts">Shifts</option><option value="Overtime">Overtime</option><option value="Leave">Leave</option><option value="Work from home">Work from home</option><option value="Documents">Documents</option><option value="Payroll">Payroll</option><option value="Reports">Reports</option><option value="Holidays">Holidays</option><option value="Announcements">Announcements</option><option value="Notifications">Notifications</option><option value="AI assistance">AI assistance</option></select>
      <input class="input" type="date" id="from" aria-label="From date" style="width:auto">
      <input class="input" type="date" id="to" aria-label="To date" style="width:auto">
    </div>
    <div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Who</th><th>Module</th><th>Action</th><th>Details</th><th>IP address</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="pager" id="pager" hidden></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/audit.js"></script>
</body>
</html>
