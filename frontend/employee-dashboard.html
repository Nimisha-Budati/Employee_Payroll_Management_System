<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Dashboard · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1 id="greeting">Dashboard</h1><p>Your attendance, leave and pay at a glance.</p></div>
    <div class="page-actions" id="actions"></div>
  </div>
  <div id="notice" class="stack-sm" style="margin-bottom:20px"></div>
  <section class="grid grid-4" id="stats"></section>
  <div class="grid grid-main" style="margin-top:20px">
    <section class="card"><div class="card-header"><div><h2>Take-home pay</h2><p>Net salary of your recent payslips</p></div><a class="btn btn-sm" href="employee-payslips.html">All payslips</a></div><div class="card-body" id="trend"></div></section>
    <section class="card"><div class="card-header"><div><h2>Leave balance</h2><p id="balYear"></p></div><a class="btn btn-sm" href="employee-leave.html">Apply</a></div><div id="balances"></div></section>
  </div>
  <div class="grid grid-2" style="margin-top:20px">
    <section class="card"><div class="card-header"><div><h2>Upcoming holidays</h2></div><a class="btn btn-sm" href="employee-holidays.html">Calendar</a></div><ul class="list" id="holidays"></ul></section>
    <section class="card"><div class="card-header"><div><h2>Latest announcements</h2></div><a class="btn btn-sm" href="announcements.html">View all</a></div><ul class="list" id="announcements"></ul></section>
  </div>
</main>
<script src="js/app.js"></script>
<script src="js/employee-dashboard.js"></script>
</body>
</html>
