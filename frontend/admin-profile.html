<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>My profile · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="ADMIN">
<main id="content">
  <div class="page-header">
    <div><h1>My profile</h1><p>Your account details.</p></div>
    <div class="page-actions" id="actions"></div>
  </div>
  <div class="grid grid-main">
    <section class="card">
      <div class="card-header"><div><h2>Personal details</h2></div></div>
      <form class="card-body form-grid" id="form" novalidate>
        <div class="alert alert-danger span-2" id="formError" hidden></div>
        <div class="field"><label for="first_name">First name</label><input class="input" id="first_name" name="first_name" maxlength="150"></div>
        <div class="field"><label for="last_name">Last name</label><input class="input" id="last_name" name="last_name" maxlength="150"></div>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" required></div>
        <div class="field"><label for="phone">Phone</label><input class="input" id="phone" name="phone" type="tel"></div>
        <div class="field span-2"><label for="address">Address</label><textarea class="textarea" id="address" name="address"></textarea></div>
        <div class="span-2"><button class="btn btn-primary" type="submit">Save changes</button></div>
      </form>
    </section>
    <section class="card">
      <div class="card-header"><div><h2>Company details</h2><p>Your company workspace details.</p></div></div>
      <form class="card-body form-grid" id="companyForm" novalidate>
        <div class="alert alert-danger span-2" id="companyError" hidden></div>
        <div class="field span-2"><label for="company_name">Company name</label><input class="input" id="company_name" name="name" maxlength="160" required></div>
        <div class="field span-2"><label for="company_email">Company email</label><input class="input" id="company_email" name="email" type="email" required></div>
        <div class="field span-2"><label for="company_phone">Contact number</label><input class="input" id="company_phone" name="phone" maxlength="20"></div>
        <div class="field span-2"><label for="company_address">Address</label><textarea class="textarea" id="company_address" name="address"></textarea></div>
        <div class="span-2"><button class="btn btn-primary" type="submit">Save company details</button></div>
      </form>
    </section>
    <div class="stack">
      <section class="card"><div class="card-body" style="text-align:center">
        <span class="avatar avatar-lg" id="avatar" style="margin:0 auto 12px"></span>
        <div style="font-weight:650;font-size:16px" id="pName"></div><div class="muted" id="pRole"></div>
        <div style="margin-top:14px"><label class="btn btn-sm" for="photo"> Change photo</label><input type="file" id="photo" accept="image/png,image/jpeg" class="sr-only"></div>
        <p class="subtle" style="font-size:12.5px;margin:10px 0 0">JPG or PNG, up to 2 MB.</p>
      </div></section>
      <section class="card" id="empCard" hidden><div class="card-header"><div><h2>Employment</h2></div></div><div class="card-body"><dl class="kv" id="empKv"></dl></div></section>
    </div>
  </div>
</main>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
