<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Onboarding · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1>Onboarding</h1><p>Each new employee's checklist of profile details and documents. Review it and mark onboarding complete once everything is provided.</p></div>
    <div class="page-actions"><button class="btn" id="settingsBtn" type="button"></button></div>
  </div>
  <section class="grid grid-3" id="stats" aria-label="Onboarding counts"></section>
  <section class="card" style="margin-top:20px">
    <div class="tabs" role="tablist" id="stateTabs">
      <button class="tab" type="button" role="tab" data-state="OPEN" aria-selected="true">Open</button>
      <button class="tab" type="button" role="tab" data-state="READY" aria-selected="false">Ready for review</button>
      <button class="tab" type="button" role="tab" data-state="IN_PROGRESS" aria-selected="false">In progress</button>
      <button class="tab" type="button" role="tab" data-state="COMPLETED" aria-selected="false">Completed</button>
    </div>
    <div class="toolbar">
      <div class="input-group grow"><span id="searchIcon"></span><input class="input" id="search" type="search" placeholder="Search by name or ID" aria-label="Search employees"></div>
      <select class="select" id="department" aria-label="Department"><option value="">All departments</option></select>
    </div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Employee</th><th>Joined</th><th style="min-width:150px">Progress</th><th>Still needed</th><th>Status</th><th class="right">Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/onboarding.js"></script>
</body>
</html>
