<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Payroll runs · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1>Payroll runs</h1><p>Generate draft payslips for a finished month, review them, then finalise.</p></div>
    <div class="page-actions">
      <select class="select" id="month" aria-label="Month"></select>
      <select class="select" id="year" aria-label="Year"></select>
      <button class="btn" id="exportBtn" type="button"></button>
      <button class="btn btn-primary" id="runBtn" type="button"></button>
    </div>
  </div>

  <section class="grid grid-4" id="stats" aria-label="Totals for the selected month"></section>

  <section class="card" style="margin-top:20px">
    <div class="toolbar">
      <div class="input-group grow"><span id="searchIcon"></span><input class="input" id="search" type="search" placeholder="Search by name, ID or department" aria-label="Search payslips"></div>
      <select class="select" id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="DRAFT">Draft</option><option value="PAID">Paid</option></select>
      <button class="btn" id="varianceBtn" type="button" hidden></button>
      <button class="btn btn-success" id="finalizeBtn" type="button" hidden></button>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Employee</th><th>Department</th><th class="right">Paid days</th><th class="right">Gross</th><th class="right">Deductions</th><th class="right">Net</th><th>Status</th><th class="right">Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager" hidden></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/payslip-view.js"></script>
<script src="js/payroll.js"></script>
</body>
</html>
