<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Overtime · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1>Overtime</h1><p id="lead">Overtime hours, their approval status and the amount paid in payroll.</p></div>
    <div class="page-actions">
      <select class="select" id="month" aria-label="Month"></select>
      <select class="select" id="year" aria-label="Year"></select>
      <span id="actions" class="row" style="gap:8px"></span>
    </div>
  </div>
  <section class="grid grid-4" id="stats" aria-label="Overtime totals"></section>
  <section class="card" style="margin-top:20px">
    <div class="toolbar">
      <div class="input-group grow" id="searchBox"><span id="searchIcon"></span><input class="input" id="search" type="search" placeholder="Search by name or ID" aria-label="Search overtime"></div>
      <select class="select" id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="PENDING">Pending</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option><option value="CANCELLED">Cancelled</option></select>
    </div>
    <div class="table-wrap"><table class="table"><thead id="head"></thead><tbody id="rows"></tbody></table></div>
    <div class="pager" id="pager" hidden></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/overtime.js"></script>
</body>
</html>
