<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Holiday calendar · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="EMPLOYEE">
<main id="content">
  <div class="page-header">
    <div><h1>Holiday calendar</h1><p>Company holidays for the year.</p></div>
    <div class="page-actions" id="actions"></div>
  </div>
  <section class="card">
    <div class="card-header">
      <div class="row"><button class="icon-btn" id="prev" type="button" aria-label="Previous month"></button><h2 id="monthTitle" aria-live="polite"></h2><button class="icon-btn" id="next" type="button" aria-label="Next month"></button></div>
      <button class="btn btn-sm" id="todayBtn" type="button">Today</button>
    </div>
    <div class="cal-head"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="cal-grid" id="grid"></div>
  </section>
  <section class="card" style="margin-top:20px"><div class="card-header"><div><h2 id="listTitle">Holidays</h2></div></div><ul class="list" id="list"></ul></section>
</main>
<script src="js/app.js"></script>
<script src="js/holidays.js"></script>
</body>
</html>
