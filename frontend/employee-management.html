<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Employees · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1>Employees</h1><p>Add, edit and manage employee records.</p></div>
    <div class="page-actions"><button class="btn" id="excelBtn" type="button"></button><button class="btn" id="deptBtn" type="button"></button><button class="btn btn-primary" id="addEmployee" type="button"></button></div>
  </div>

  <section id="pendingBox" class="alert alert-info" hidden style="display:block;margin-bottom:20px"></section>

  <section class="card">
    <div class="toolbar">
      <div class="input-group grow"><span id="searchIcon"></span><input class="input" id="search" type="search" placeholder="Search by name, ID, email or department" aria-label="Search employees"></div>
      <select class="select" id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select>
      <select class="select" id="deptFilter" aria-label="Filter by department"><option value="">All departments</option></select>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr>
          <th><button class="sort-btn" data-sort="name">Employee</button></th>
          <th><button class="sort-btn" data-sort="employee_id">ID</button></th>
          <th><button class="sort-btn" data-sort="department">Department</button></th>
          <th><button class="sort-btn" data-sort="joining_date">Joined</button></th>
          <th><button class="sort-btn" data-sort="status">Status</button></th>
          <th>Salary</th>
          <th class="right">Actions</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager" hidden></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/employees.js"></script>
</body>
</html>
