<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Attendance · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="content">
  <div class="page-header">
    <div><h1>Attendance</h1><p>Check-ins verified against the office location, with working hours and late minutes against each employee's shift.</p></div>
    <div class="page-actions" id="actions"><button class="btn" id="excelBtn" type="button"></button><button class="btn" id="settingsBtn" type="button"></button></div>
  </div>
  <section class="grid grid-4" id="stats" aria-label="Attendance totals for the filters"></section>
  <section class="card" style="margin-top:20px">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" id="tabRecords" aria-selected="true">Daily records</button>
      <button class="tab" type="button" role="tab" id="tabSummary" aria-selected="false">Late &amp; hours summary</button>
    </div>
    <div class="toolbar">
      <div class="input-group grow"><span id="searchIcon"></span><input class="input" id="search" type="search" placeholder="Search by name or ID" aria-label="Search attendance"></div>
      <select class="select" id="department" aria-label="Department"><option value="">All departments</option></select>
      <label class="sr-only" for="from">From</label><input class="input" type="date" id="from" aria-label="From date" style="width:auto">
      <label class="sr-only" for="to">To</label><input class="input" type="date" id="to" aria-label="To date" style="width:auto">
      <select class="select" id="late" aria-label="Punctuality"><option value="">All check-ins</option><option value="true">Late only</option><option value="false">On time only</option></select>
    </div>
    <div class="table-wrap" id="recordsPane"><table class="table"><thead><tr><th>Employee</th><th>Date</th><th>Shift</th><th>Check in</th><th class="right">Late</th><th>Check out</th><th class="right">Hours</th><th class="right">Distance in / out</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="table-wrap" id="summaryPane" hidden><table class="table"><thead><tr><th>Employee</th><th>Department</th><th class="right">Days present</th><th class="right">Late days</th><th class="right">Late minutes</th><th class="right">Avg late</th><th class="right">Hours worked</th></tr></thead><tbody id="summaryRows"></tbody></table></div>
    <div class="pager" id="pager" hidden></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
