<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f6">
  <script src="js/theme.js"></script>
  <title>Documents · PayrollPro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="ADMIN">
<main id="content">
  <div class="page-header">
    <div><h1>Documents</h1><p>Review documents uploaded by employees.</p></div>
    <div class="page-actions" id="actions"></div>
  </div>
  <section class="card">
    <div class="toolbar"><div class="input-group grow"><span id="searchIcon"></span><input class="input" id="search" type="search" placeholder="Search by employee, ID or title" aria-label="Search documents"></div><select class="select" id="typeFilter" aria-label="Filter by type"></select><select class="select" id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="PENDING">Pending review</option><option value="VERIFIED">Verified</option><option value="REJECTED">Rejected</option></select><select class="select" id="expiryFilter" aria-label="Filter by expiry"></select></div>
    <div class="alert alert-warning" id="expirySummary" role="status" hidden style="margin:0 16px 12px"></div>
    <div class="table-wrap"><table class="table"><thead id="head"></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
</body>
</html>
